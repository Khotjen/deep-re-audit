<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="3840" viewBox="0 0 1080 1920" role="img" aria-labelledby="title description">
<title id="title">Deep-Re-Audit v2.7: evidence-first audit and authorized repair workflow</title>
<desc id="description">Portrait infographic showing target identity, three audit passes, conditional Blast Web Analysis, a common registry, read-only and authorized repair branches, seven re-audit outcomes, and decision precedence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d7798"/></marker></defs>
<rect width="1080" height="1920" fill="#edf2f8"/>
<style>text {font-family:'DejaVu Sans',sans-serif;fill:#172b45} .white {fill:white} .muted {fill:#597089} .mono {font-family:'DejaVu Sans Mono',monospace} </style>
<rect x="32" y="24" width="1016" height="145" rx="22" fill="#142b48" stroke="#142b48"/>
<text x="58" y="61" font-size="18" font-weight="700" style="fill:#68e3c2">DEEP-RE-AUDIT  /  v2.7</text>
<text x="58" y="111" font-size="36" font-weight="700" style="fill:#ffffff">Evidence first. Repair with proof.</text>
<text x="58" y="146" font-size="16" style="fill:#d3e0f0">A protocol for an AI agent — tools and permissions come from the host.</text>
<rect x="48" y="192" width="984" height="164" rx="16" fill="#ffffff" stroke="#d6e0ed"/>
<text x="70" y="225" font-size="21" font-weight="700">01  FRAME THE CLAIM &amp; IDENTIFY THE SNAPSHOT</text>
<text x="70" y="256" font-size="16">Target • version/commit • scope • configuration • environment • authority</text>
<text x="70" y="281" font-size="16">Choose: TARGETED | CLOSURE | RUNTIME-VERIFICATION</text>
<text x="70" y="306" font-size="16">Name the basis: design, implementation, or production. Inventory missing material.</text>
<text x="70" y="331" font-size="16">Recheck before verdict/write. A recorded hash is identity, not an atomic lock.</text>
<path d="M540,359 L540,389" fill="none" stroke="#5d7798" stroke-width="3" marker-end="url(#arrow)"/>
<text x="48" y="413" font-size="21" font-weight="700">02  THREE PASSES → ONE RECONCILED AUDIT</text>
<rect x="48" y="435" width="312" height="190" rx="16" fill="#ffffff" stroke="#d6e0ed"/>
<rect x="48" y="435" width="312" height="7" rx="3" fill="#176c9c"/>
<text x="64" y="474" font-size="18" font-weight="700" style="fill:#176c9c">A  STRUCTURAL</text>
<text x="64" y="507" font-size="14">Authority and invariants</text>
<text x="64" y="531" font-size="14">State ownership / source of truth</text>
<text x="64" y="555" font-size="14">Contracts and consumers</text>
<text x="64" y="579" font-size="14">Transactions and concurrency</text>
<text x="64" y="603" font-size="14">State transitions / compatibility</text>
<rect x="384" y="435" width="312" height="190" rx="16" fill="#ffffff" stroke="#d6e0ed"/>
<rect x="384" y="435" width="312" height="7" rx="3" fill="#805ab4"/>
<text x="400" y="474" font-size="18" font-weight="700" style="fill:#805ab4">B  FAILURE / SECURITY</text>
<text x="400" y="507" font-size="14">Trust and mutation boundaries</text>
<text x="400" y="531" font-size="14">Retries, interruption, recovery</text>
<text x="400" y="555" font-size="14">Abuse and resource exhaustion</text>
<text x="400" y="579" font-size="14">Supply chain / agentic risks</text>
<text x="400" y="603" font-size="14">Failure propagation and controls</text>
<rect x="720" y="435" width="312" height="190" rx="16" fill="#ffffff" stroke="#d6e0ed"/>
<rect x="720" y="435" width="312" height="7" rx="3" fill="#138172"/>
<text x="736" y="474" font-size="18" font-weight="700" style="fill:#138172">C  EVIDENCE / CHALLENGE</text>
<text x="736" y="507" font-size="14">Try to falsify each material claim</text>
<text x="736" y="531" font-size="14">Provenance and independence</text>
<text x="736" y="555" font-size="14">Version / environment freshness</text>
<text x="736" y="579" font-size="14">Coverage, sensitivity, regression</text>
<text x="736" y="603" font-size="14">Missing proof stays unverified</text>
<text x="48" y="652" font-size="15" style="fill:#597089">Passes challenge shared records; repetition or majority vote adds no authority.</text>
<path d="M540,664 L540,684" fill="none" stroke="#5d7798" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="48" y="700" width="984" height="149" rx="16" fill="#e7f5f0" stroke="#b6ddce"/>
<text x="70" y="733" font-size="21" font-weight="700" style="fill:#146f61">03  CONDITIONAL BLAST WEB ANALYSIS (BWA)</text>
<text x="70" y="762" font-size="15">Activate during any pass for material multi-cause, shared-resource or cross-boundary signals.</text>
<text x="70" y="785" font-size="15">Expand only relationships that can change diagnosis, repair, blast radius or closure.</text>
<text x="70" y="808" font-size="15">Require evidence or an explicit unresolved mechanism; keep contrary/negative evidence.</text>
<text x="70" y="831" font-size="15">Connection ≠ causality. Pruned speculation ≠ missing coverage. Truncation stays PARTIAL.</text>
<path d="M540,853 L540,875" fill="none" stroke="#5d7798" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="48" y="891" width="984" height="76" rx="16" fill="#1d3b5c" stroke="#1d3b5c"/>
<text x="70" y="918" font-size="17" font-weight="700" style="fill:#ffffff">SHARED RECORDS — KEEP THE SIX STATES DISTINCT</text>
<text x="70" y="944" font-size="14" style="fill:#e0ebf8">Finding lifecycle • verification • causality • repair disposition • re-audit outcome • audit decision</text>
<path d="M540,971 L540,992" fill="none" stroke="#5d7798" stroke-width="3" marker-end="url(#arrow)"/>
<text x="48" y="1015" font-size="21" font-weight="700">04  REPAIR AUTHORIZATION GATE</text>
<rect x="48" y="1037" width="296" height="299" rx="16" fill="#fff7e9" stroke="#ead2a3"/>
<text x="68" y="1071" font-size="20" font-weight="700" style="fill:#956416">NO / AUDIT ONLY</text>
<text x="68" y="1104" font-size="15">Remain read-only.</text>
<text x="68" y="1128" font-size="15">Report evidenced findings,</text>
<text x="68" y="1152" font-size="15">uncertainty, proposed fixes,</text>
<text x="68" y="1176" font-size="15">and verification obligations.</text>
<text x="68" y="1200" font-size="15"></text>
<text x="68" y="1224" font-size="15">No mutation authority comes</text>
<text x="68" y="1248" font-size="15">from an audit or graph.</text>
<text x="68" y="1272" font-size="15"></text>
<text x="68" y="1296" font-size="15">Proceed to a scoped decision.</text>
<rect x="368" y="1037" width="664" height="136" rx="16" fill="#ffffff" stroke="#d6e0ed"/>
<text x="390" y="1071" font-size="20" font-weight="700" style="fill:#176c9c">YES — MINIMAL, GUARDED CORRECTION</text>
<text x="390" y="1103" font-size="14">User authorization + host permission must both hold.</text>
<text x="390" y="1126" font-size="14">One evidenced cause or inseparable repair set. Preserve working behavior.</text>
<text x="390" y="1149" font-size="14">Record necessity, regressions, recovery plan; absorb into the canonical target.</text>
<path d="M700,1177 L700,1200" fill="none" stroke="#5d7798" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="368" y="1217" width="664" height="119" rx="16" fill="#ffffff" stroke="#d6e0ed"/>
<text x="390" y="1250" font-size="20" font-weight="700" style="fill:#176c9c">05  VERIFY &amp; REDISCOVER BOUNDARIES</text>
<text x="390" y="1280" font-size="14">Compare compatible before/after snapshots and an adequate test oracle.</text>
<text x="390" y="1303" font-size="14">Recheck actual inbound/outbound paths, new dependencies and residual risks.</text>
<text x="390" y="1326" font-size="14">Reuse unaffected evidence only with explicit equivalence.</text>
<path d="M700,1340 L700,1361" fill="none" stroke="#5d7798" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="368" y="1377" width="664" height="137" rx="16" fill="#e9eef8" stroke="#bccde8"/>
<text x="390" y="1407" font-size="18" font-weight="700" style="fill:#324e80">06  RECORD EXACTLY ONE RE-AUDIT OUTCOME</text>
<text x="390" y="1435" font-size="13">RESOLVED • SAME_DEFECT • NEW_DEFECT • SECONDARY_EFFECT</text>
<text x="390" y="1459" font-size="13">FALSE_POSITIVE • NO_PROGRESS • INCONCLUSIVE</text>
<text x="390" y="1488" font-size="14" font-weight="700">RESOLVED ≠ FIXED until absorption + scoped verification hold.</text>
<path d="M1032,1435 L1054,1435 L1054,1054 L1032,1054" fill="none" stroke="#9a740f" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text transform="translate(1045 1398) rotate(-90)" font-size="11" style="fill:#956416">FURTHER REPAIR: AUTHORIZED + EVIDENCED</text>
<rect x="48" y="1377" width="296" height="137" rx="16" fill="#fff7e9" stroke="#ead2a3"/>
<text x="68" y="1408" font-size="18" font-weight="700" style="fill:#956416">LOOP GUARD</text>
<text x="68" y="1435" font-size="13">NO_PROGRESS → freeze that path.</text>
<text x="68" y="1456" font-size="13">Inspect a plausible blind spot.</text>
<text x="68" y="1477" font-size="13">Reopen only with new evidence,</text>
<text x="68" y="1498" font-size="13">changed conditions or oracle.</text>
<path d="M196,1336 L196,1356 L354,1356 L354,1539 L540,1539" fill="none" stroke="#5d7798" stroke-width="3"/>
<path d="M700,1518 L700,1539 L540,1539 L540,1560" fill="none" stroke="#5d7798" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="48" y="1576" width="984" height="227" rx="16" fill="#ffffff" stroke="#d6e0ed"/>
<text x="70" y="1610" font-size="21" font-weight="700">07  SCOPED DECISION — APPLY PRECEDENCE PER CLAIM</text>
<text x="70" y="1642" font-size="15">1  REJECTED — requested candidate is untenable/prohibited; bounded repair is insufficient.</text>
<text x="70" y="1668" font-size="15">2  BASELINE_BLOCKED — a known mandatory readiness gate failed or is missing.</text>
<text x="70" y="1694" font-size="15">3  NOT VERIFIED — a bounded claim lacks adequate evidence; no earlier decision applies.</text>
<text x="70" y="1720" font-size="15">4  ONE POSITIVE DECISION — all gates pass for the named snapshot, scope and basis.</text>
<text x="70" y="1754" font-size="14" font-weight="700" style="fill:#176c9c">Design baseline | Implementation verified | Production-equivalent verified | Production verified</text>
<text x="70" y="1780" font-size="14" style="fill:#597089">Design closure does not prove runtime behavior. Stop only with explicit limits and residual risks.</text>
<text x="48" y="1840" font-size="15" font-weight="700">PROTOCOL, NOT CERTIFICATION — AI can miss defects. Evidence quality determines assurance.</text>
<text x="48" y="1872" font-size="14" style="fill:#597089">Created by khotjen (khotjen@gmail.com), developed with assistance from OpenAI GPT.</text>
<text x="48" y="1896" font-size="13" style="fill:#597089">Canonical rules: SKILL.md + references/  •  English workflow summary  •  9:16 vector master</text>
</svg>
